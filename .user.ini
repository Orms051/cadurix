; Cadurix v5.4 — Configuration PHP sécurisée
; À placer dans le répertoire racine du projet

; Masquer la version PHP
expose_php = Off

; Désactiver les fonctions dangereuses
; curl_exec et curl_multi_exec sont nécessaires pour l'API Claude (IA) et Push PWA
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,phpinfo

; Erreurs — ne pas afficher en prod
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Sessions sécurisées
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Strict
session.use_strict_mode = 1
session.gc_maxlifetime = 3600

; Taille upload
upload_max_filesize = 5M
post_max_size = 6M

; Sécurité
allow_url_fopen = Off
allow_url_include = Off
